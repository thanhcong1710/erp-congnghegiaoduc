## 1. TỔNG QUAN GIẢI PHÁP

### 🎯 Vấn đề mà thị trường đang gặp phải

| Thách thức | Hậu quả |
|---|---|
| Quản lý khách hàng phân tán (Excel, sổ tay) | Mất lead, chồng chéo chăm sóc, không đo lường được hiệu quả |
| Vận hành lớp học thủ công | Lỗi xếp lớp, thiếu/thừa học sinh, sai sót điểm danh |
| Không có dữ liệu realtime | Ra quyết định chậm, không tối ưu được tỉ lệ tái phí |
| Hệ thống rời rạc, không liên thông | Nhập liệu trùng lặp, mất thời gian đối chiếu |

### 💡 Giải pháp: EduTech ERP — All-in-One Platform

```mermaid
graph LR
    A[📱 CRM<br/>Quản lý Lead] --> B[👨🎓 LMS<br/>Vận hành lớp]
    B --> C[💰 Kế Toán<br/>Thu phí & Báo cáo]
    C --> D[📊 Dashboard<br/>BI & Analytics]
    D --> E[🤖 AI Assistant<br/>Chatbot thông minh]
    E --> A
```

### 🏆 Điểm nổi bật

- **🔗 Liên thông hoàn toàn** — CRM → LMS → Kế toán → Báo cáo trên cùng 1 nền tảng
- **🏢 Multi-Branch** — Quản lý đồng thời nhiều trung tâm, phân quyền chi tiết theo vai trò
- **🤖 AI-Powered** — Chatbot AI Gemini 2.5 tích hợp trực tiếp vào nghiệp vụ, truy vấn dữ liệu bằng ngôn ngữ tự nhiên
- **📱 Responsive** — Giao diện SPA (Vue.js) mượt mà trên mọi thiết bị
- **🔐 Phân quyền đa tầng** — Role-based + Permission-based (Admin, CEO, EC, CM, Teacher, TA, Kế toán...)

## 2. KIẾN TRÚC HỆ THỐNG

```mermaid
graph TB
    subgraph Frontend["🖥️ Frontend - Vue.js SPA"]
        VUE[Vue 2 + Vuesax UI]
        ROUTER[Vue Router]
        AXIOS[Axios HTTP Client]
    end
    
    subgraph Backend["⚙️ Backend - Laravel PHP"]
        API[RESTful API]
        AUTH[JWT Authentication]
        RBAC[Role & Permission System]
        SERVICES[Business Services]
    end
    
    subgraph AI["🤖 AI Engine"]
        GEMINI[Google Gemini 2.5 Flash/Pro]
        TOOLS[Function Calling Tools]
        KB[Knowledge Base]
    end
    
    subgraph Database["🗄️ Database"]
        MYSQL[(MySQL)]
    end
    
    VUE --> AXIOS --> API
    API --> AUTH --> RBAC --> SERVICES
    SERVICES --> MYSQL
    SERVICES --> AI
    GEMINI --> TOOLS --> SERVICES
```

**Công nghệ sử dụng:**

| Layer | Công nghệ | Mô tả |
|---|---|---|
| Frontend | Vue.js 2, Vuesax, ApexCharts | Giao diện SPA hiện đại, biểu đồ trực quan |
| Backend | Laravel 7+, PHP 8.2 | Framework PHP mạnh mẽ, RESTful API |
| Auth | JWT Token | Bảo mật, hỗ trợ multi-device login |
| AI | Google Gemini 2.5 | Function Calling, Natural Language Query |
| Database | MySQL | RDBMS tin cậy, quan hệ chặt chẽ |
| Infra | Docker | Containerized, dễ triển khai, scale |

### 📌 BƯỚC 1: Thêm Mới Khách Hàng (Lead)

> **Menu:** `CRM → Khách hàng → Thêm mới`

#### Khả năng nhập liệu

| Trường thông tin | Mô tả |
|---|---|
| **Họ tên phụ huynh** | Bắt buộc — người liên hệ chính |
| **Số điện thoại 1 & 2** | Hệ thống tự động **kiểm tra trùng lặp (duplicate)** real-time |
| **Email, Địa chỉ** | Thông tin liên lạc bổ sung |
| **Tỉnh/Thành, Quận/Huyện** | Dữ liệu địa lý, hỗ trợ phân vùng Marketing |
| **Nguồn (Source)** | Facebook, Google, Tờ rơi, Giới thiệu... — theo dõi kênh hiệu quả |
| **Chi tiết nguồn (Source Detail)** | Tổ chức theo chi nhánh, giúp phân bổ ngân sách Marketing |
| **Nghề nghiệp PH** | Phân khúc khách hàng tiềm năng |
| **Học sinh** | Thêm trực tiếp 1 hoặc nhiều con trong cùng 1 form |
| **SĐT người giới thiệu (C2C)** | Liên kết chương trình giới thiệu, tự động validate |

#### 🔒 Cơ chế Chống Trùng Thông Minh

Khi nhập SĐT, hệ thống xử lý 3 trường hợp:

```mermaid
flowchart TD
    A[Nhập SĐT] --> B{Kiểm tra trùng?}
    B -->|Không trùng| C[✅ Cho phép tạo mới]
    B -->|Trùng, đang bị khóa| D["🔒 Thông báo: KH đang thuộc NV XYZ<br/>+ Thời gian còn lại để ghi đè"]
    B -->|Trùng, không khóa| E["⚠️ Hỏi: KH đã tồn tại, bạn muốn chăm sóc?<br/>→ Ghi đè quyền quản lý"]
```

> **Quy tắc Lock 15 ngày:** Sau khi được assigned, nhân viên có 15 ngày độc quyền chăm sóc lead. Quá thời hạn mà không chăm sóc → hệ thống tự động mở khóa để nhân viên khác có thể tiếp nhận.

### 📌 BƯỚC 2: Chăm Sóc Khách Hàng

> **Menu:** `CRM → Khách hàng → Chi tiết → Tab Chăm sóc`

#### Dashboard Chăm sóc thông minh

Trang danh sách khách hàng hiển thị **5 tab thông minh tự động phân loại**:

| Tab | Ý nghĩa | Giá trị kinh doanh |
|---|---|---|
| **🟢 Tất cả** | Toàn bộ KH thuộc quyền quản lý | Tổng quan chung |
| **🔴 Chưa chăm sóc** | KH mới, chưa có lần chăm sóc nào | Ưu tiên cao nhất |
| **🟡 Hôm nay** | Lịch chăm sóc đúng ngày hôm nay | Nhắc nhở hành động ngay |
| **🟠 Quá hạn** | Đã quá ngày hẹn chăm sóc | Cảnh báo — cần xử lý gấp |
| **🔵 Ticket đang mở** | KH có khiếu nại/yêu cầu chưa giải quyết | Nâng cao trải nghiệm KH |

#### Các hình thức chăm sóc

- **📞 Ghi nhận cuộc gọi** — Lưu nội dung trao đổi, kết quả cuộc gọi
- **💬 Gửi SMS** — Gửi tin nhắn trực tiếp từ hệ thống
- **📅 Lên lịch hẹn** — Đặt lịch chăm sóc tiếp theo (`next_care_date`)
- **🎫 Ticket** — Tạo yêu cầu/khiếu nại, theo dõi trạng thái (Mới → Đang xử lý → Hoàn thành → Đóng)
- **📝 Lịch sử Log** — Toàn bộ thay đổi được ghi lại chi tiết (ai làm, lúc nào, nội dung gì)

#### Import Data Hàng Loạt

> **Menu:** `CRM → Import`

- Upload file Excel danh sách khách hàng
- Hệ thống tự validate, loại bỏ trùng
- **Hỗ trợ Assign tự động** — Chia đều lead cho nhân viên kinh doanh theo round-robin

### 📌 BƯỚC 3: Tạo Học Sinh (CRM Student)

> **Menu:** `CRM → Chi tiết khách hàng → Tab Học sinh → Thêm mới`

Tại đây, nhân viên tạo hồ sơ học sinh con từ hồ sơ phụ huynh:

| Thông tin | Chi tiết |
|---|---|
| Họ tên học sinh | Tên đầy đủ |
| Giới tính, Ngày sinh | Thông tin cá nhân |
| Cấp học, Trường | Lớp mấy, học ở đâu |
| Ghi chú | Nhu cầu đặc biệt, sở thích |

> ✅ **Liên kết tự động:** Khi học sinh được nhập học chính thức (LMS), hệ thống tự đồng bộ dữ liệu giữa CRM Student và LMS Student.

---

### 📌 BƯỚC 4: Check-in Trung Tâm

> **Menu:** `LMS → Học sinh → Checkin`

Quy trình Check-in theo dõi học sinh đến thử tại trung tâm:

```mermaid
flowchart LR
    A[KH hẹn đến TT] --> B[Nhân viên checkin trên hệ thống]
    B --> C{Kết quả}
    C -->|Quan tâm| D[✅ Checked - Đã đến]
    C -->|Đăng ký| E[🎉 Upgrade - Chuyển sang nhập học]
    C -->|Từ chối| F[❌ Không đến / Không quan tâm]
```

**3 trạng thái Checkin:**
- **Checked (Đã đến)** — GĐ xác nhận khách đã đến trung tâm
- **Upgrade (Nâng cấp)** — Khách hàng đồng ý đăng ký → Tự động chuyển sang quy trình nhập học
- **Cancelled** — Khách không đến hoặc không quan tâm

### 📌 BƯỚC 5: Nhập Học (Tạo Hợp Đồng)

> **Menu:** `LMS → Vận hành → Nhập học`

Quy trình nhập học bao gồm tạo hợp đồng (Contract) cho học sinh:

| Thao tác | Chi tiết |
|---|---|
| **Chọn học sinh** | Tìm kiếm từ CRM hoặc tạo mới |
| **Chọn trung tâm** | Trung tâm nào sẽ theo học |
| **Chọn khóa học (Product)** | IELTS, TOEIC, Tiếng Anh Giao Tiếp... |
| **Chọn gói phí (Tuition Fee)** | Gói 3 tháng, 6 tháng, 12 tháng... |
| **Áp mã chiết khấu** | Mã giảm giá nội bộ, voucher C2C |
| **Áp Coupon** | Mã khuyến mãi từ chiến dịch Marketing |

#### Hệ thống gói phí thông minh

```mermaid
graph TD
    A[Gói Phí] --> B[Gói Lẻ]
    A --> C[Gói Combo]
    
    B --> B1["IELTS 6T - 72 buổi<br/>18,000,000 VNĐ"]
    B --> B2["TOEIC 3T - 36 buổi<br/>9,500,000 VNĐ"]
    
    C --> C1["Combo IELTS+TOEIC 9T<br/>25,000,000 VNĐ<br/>(tiết kiệm 2,500,000)"]
    
    B1 --> D[Áp dụng theo trung tâm]
    B2 --> D
    C1 --> D
    D --> E[Thời hạn hiệu lực]
    E --> F[New / Renew]
```

> ✅ **Đặc biệt:** Gói phí được cấu hình áp dụng cho từng trung tâm cụ thể, có ngày hiệu lực/hết hạn, phân biệt New (đăng ký mới) và Renew (tái phí).

### 📌 BƯỚC 6: Đóng Phí (Kế Toán)

> **Menu:** `LMS → Kế toán → Chờ thu phí / Đã thu phí`

#### Luồng thu phí 2 bước an toàn

```mermaid
flowchart LR
    A["💳 EC tạo phiếu chờ thu"] --> B["🏦 Kế toán xác nhận<br/>đã nhận tiền"]
    B --> C["🧾 In phiếu thu"]
    C --> D["✅ Hợp đồng active"]
```

| Chức năng | Mô tả |
|---|---|
| **Chờ thu phí** | Danh sách hợp đồng chờ thanh toán, hiển thị số tiền cần thu, công nợ |
| **Đã thu phí** | Lịch sử thu phí, lọc theo trung tâm/ngày/nhân viên |
| **In phiếu thu** | Template phiếu thu, in trực tiếp từ hệ thống |
| **Đóng phí từng phần** | Hỗ trợ đặt cọc trước, thu nốt sau |

### 📌 BƯỚC 7: Xếp Lớp

> **Menu:** `LMS → Vận hành → Xếp lớp`

Giao diện xếp lớp trực quan cho phép:

- **Chọn lớp theo Trung tâm + Khóa học** → Hiển thị danh sách lớp đang hoạt động
- **Xem thông tin lớp chi tiết:** Sĩ số hiện tại / Sĩ số tối đa, lịch học, phòng học, giáo viên
- **Tìm kiếm học sinh** chờ xếp lớp → Kéo thả hoặc thêm vào lớp
- **Cảnh báo tự động** khi lớp đã đủ/vượt sĩ số

> ✅ **Tự động tính ngày kết thúc:** Dựa trên lịch học của lớp, số buổi trong gói phí, và ngày nghỉ lễ → hệ thống tự động tính `enrolment_last_date` chính xác.

### 📌 BƯỚC 8: Điểm Danh

> **Menu:** `LMS → Vận hành → Điểm danh`

#### Giao diện điểm danh ma trận

Giao diện hiển thị dạng bảng ma trận: **Hàng = Học sinh**, **Cột = Buổi học** theo tháng

| Trạng thái | Ý nghĩa | Hành động tiếp theo |
|---|---|---|
| **Chưa điểm danh** | Buổi học chưa diễn ra hoặc chưa ghi nhận | — |
| **Đi học** ✅ | Học sinh đã đến lớp | Tự động trừ buổi |
| **Học bù** 🔄 | Nghỉ buổi này, đăng ký học bù lớp khác | Mở popup chọn lớp + buổi bù |
| **Đã học bù** ✅ | Đã hoàn thành buổi học bù | Tự động ghi nhận |

### 📌 BƯỚC 9: Nghiệp Vụ Vận Hành

#### 🔄 Chuyển Lớp (`LMS → Vận hành → Chuyển lớp`)

- Tìm học sinh → Chọn hợp đồng đang active
- Chọn lớp mới (cùng khóa học, cùng hoặc khác trung tâm)
- Hệ thống tự tính số buổi còn lại → chuyển qua lớp mới
- Lưu lịch sử log đầy đủ

#### 🏢 Chuyển Trung Tâm (`LMS → Vận hành → Chuyển trung tâm`)

- Phê duyệt 2 bước: EC yêu cầu → Quản lý phê duyệt
- Tự động cập nhật `branch_id` trên hợp đồng
- Giữ nguyên số buổi còn lại

#### 💸 Chuyển Phí (`LMS → Vận hành → Chuyển phí`)

- Chuyển quyền sử dụng phí từ học sinh A sang học sinh B (anh chị em)
- Tính toán số tiền tương ứng với số buổi còn lại
- Tạo hợp đồng mới cho người nhận

#### 🔁 Quy Đổi (`LMS → Vận hành → Quy đổi`)

- Đổi từ gói phí này sang gói phí khác (VD: IELTS → TOEIC)
- Tự động tính chênh lệch giá
- Hỗ trợ quy đổi giữa các gói lẻ và combo

#### ⏸️ Bảo Lưu (`LMS → Vận hành → Bảo lưu`)

- Bảo lưu đơn lẻ hoặc **bảo lưu cả lớp** (tính năng đặc biệt)
- Phê duyệt 2 bước
- Freeze số buổi còn lại, không trừ trong thời gian bảo lưu
- In phiếu bảo lưu

#### 🔄 Tái Phí (`LMS → Vận hành → Tái phí`)

- Khi học sinh hoàn thành gói phí cũ → tạo hợp đồng mới
- Áp dụng gói phí Renew riêng biệt (giá ưu đãi cho HS cũ)
- Tự động liên kết với hợp đồng trước đó (`count_recharge`)

### 🏗️ Kiến Trúc AI Function Calling

```mermaid
sequenceDiagram
    participant User
    participant Frontend as Vue.js Chat UI

    Backend->>AI: System Prompt + User Message + Tools

    Backend->>Frontend: JSON response
    Frontend->>User: Hiển thị danh sách 7 HS cho chọn
```
